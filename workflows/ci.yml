name: CI - Part 1 Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-files:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Check docs folder
        run: |
          if [ -d "docs" ]; then
            echo "PASS: docs folder exists"
            ls -la docs/
          else
            echo "FAIL: docs folder not found"
            exit 1
          fi
      
      - name: Check ERD file
        run: |
          if ls docs/*.png docs/*.pdf 2>/dev/null | grep -i erd; then
            echo "PASS: ERD file found"
          else
            echo "FAIL: ERD file (PNG/PDF) not found"
            exit 1
          fi
      
      - name: Check API Endpoint Plan
        run: |
          if ls docs/*.md docs/*.pdf 2>/dev/null | grep -i endpoint; then
            echo "PASS: API Endpoint Plan found"
          else
            echo "FAIL: API Endpoint Plan not found"
            exit 1
          fi
      
      - name: Check SQL Script
        run: |
          if ls docs/*.sql 2>/dev/null; then
            echo "PASS: SQL Script found"
          else
            echo "FAIL: SQL Script not found"
            exit 1
          fi
      
      - name: Check README
        run: |
          if [ -f "README.md" ]; then
            echo "PASS: README.md found"
          else
            echo "FAIL: README.md not found"
            exit 1
          fi
      
      - name: Check commit count
        run: |
          COMMITS=$(git rev-list --count HEAD)
          echo "Total commits: $COMMITS"
          if [ $COMMITS -ge 20 ]; then
            echo "PASS: 20+ commits"
          else
            echo "FAIL: Only $COMMITS commits (need 20+)"
            exit 1
          fi
